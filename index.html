<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>울산 여행 다이어리 (인터랙티브)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        :root {
            --bg-color: #F7F4EC;
            --card-bg: #FFFFFF;
            --primary-red: #A53B2A;
            --text-dark: #333333;
            --text-light: #777777;
            --map-bg: #E5CFB7;
            --map-shadow: #C9AE94;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none; /* 드래그 시 텍스트 선택 방지 */
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 상단 헤더 */
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(247, 244, 236, 0.95);
            z-index: 20;
        }
        .header-title {
            font-family: serif;
            font-style: italic;
            color: var(--primary-red);
            font-size: 1.1rem;
            font-weight: bold;
        }
        .header-subtitle {
            font-size: 0.85rem;
            color: var(--text-dark);
            margin-left: 10px;
        }
        .search-icon { font-size: 1.2rem; cursor: pointer; }

        /* 메인 컨텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            position: relative;
            overflow: hidden;
        }

        /* 날짜 및 타이틀 */
        .day-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            margin-top: 10px;
            z-index: 15;
        }
        .date-badge {
            width: 60px; height: 70px;
            background-color: #F9E8E0;
            border: 1px solid var(--primary-red);
            border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--primary-red);
            position: relative;
        }
        .date-badge::before {
            content: ''; position: absolute; top: 10px; width: 80%; height: 1px;
            background-color: var(--primary-red); opacity: 0.3;
        }
        .date-month { font-size: 0.6rem; margin-top: 5px; }
        .date-day { font-size: 1.6rem; font-weight: bold; line-height: 1; }
        .date-year { font-size: 0.6rem; margin-bottom: 5px; }
        
        .title-area h2 { font-size: 1.5rem; color: var(--text-dark); margin-bottom: 5px; transition: 0.3s; }
        .title-area .day-text { font-size: 0.8rem; color: var(--primary-red); font-weight: 500; margin-bottom: 8px; display: block; }
        .title-area p { font-size: 0.85rem; color: var(--text-light); line-height: 1.4; word-break: keep-all; transition: 0.3s;}

        /* 🌟 지도 영역 (드래그 가능) */
        .map-section {
            flex: 1;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background-color: var(--map-bg);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            cursor: grab; /* 잡기 커서 */
        }
        .map-section:active { cursor: grabbing; }

        /* 지도 내부 세계 (이 요소가 움직입니다) */
        .map-world {
            position: absolute;
            width: 200%; /* 넉넉하게 크기 설정 */
            height: 200%;
            top: -50%; left: -50%;
            transform-origin: center center;
            transition: transform 0.1s ease-out; /* 부드러운 이동 */
        }

        /* 3D 배경 그리드 */
        .map-bg-3d {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(201, 174, 148, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(201, 174, 148, 0.4) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(60deg) rotateZ(-45deg);
            pointer-events: none; /* 배경이 마우스 이벤트를 가로채지 않도록 */
        }

        /* 가상의 3D 건물 */
        .building {
            position: absolute;
            background-color: #D3B79A;
            box-shadow: 8px 8px 0px var(--map-shadow);
            border-radius: 4px;
            pointer-events: none;
        }
        .b1 { width: 120px; height: 80px; top: 20%; left: 10%; }
        .b2 { width: 180px; height: 120px; top: 40%; left: 50%; background-color: #DFC6AE; }
        .b3 { width: 80px; height: 150px; top: 10%; left: 60%; }
        .b4 { width: 150px; height: 70px; top: 70%; left: 20%; background-color: #E8D5C4; }
        .b5 { width: 100px; height: 100px; top: 80%; left: 70%; background-color: #C9AE94; }

        /* 🌟 지도 위 핀 (지도와 함께 움직임) */
        .map-pin {
            position: absolute;
            background-color: var(--primary-red);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(165, 59, 42, 0.4);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 2px solid white;
            z-index: 10;
        }
        .map-pin:hover {
            transform: scale(1.1);
            background-color: #C74833;
        }
        .map-pin::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: var(--primary-red) transparent transparent transparent;
        }
        .pin-number {
            background-color: white; color: var(--primary-red);
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 0.7rem;
        }

        /* 핀 위치 */
        .pin-taehwa { top: 40%; left: 25%; }
        .pin-daewangam { top: 25%; left: 60%; }
        .pin-jangsaengpo { top: 60%; left: 45%; }

        /* 상단 위치 정보 카드 (고정) */
        .location-card {
            position: absolute;
            top: 20px; left: 20px;
            background: var(--card-bg);
            padding: 12px 20px 12px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none; /* 카드가 드래그를 방해하지 않게 함 */
            transition: opacity 0.3s;
        }
        .location-card .pin-icon { color: var(--primary-red); font-size: 1.2rem; margin-bottom: 5px; }
        .location-card h3 { font-size: 1rem; color: var(--text-dark); margin-bottom: 3px; }
        .location-card p { font-size: 0.7rem; color: var(--text-light); }

        /* 🌟 지도 컨트롤 버튼 (작동함) */
        .map-controls {
            position: absolute;
            top: 20px; right: 20px;
            display: flex; flex-direction: column;
            background: rgba(255,255,255,0.95);
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 15;
        }
        .map-controls button {
            border: none; background: transparent; padding: 10px 14px;
            font-size: 1.2rem; cursor: pointer; color: var(--text-dark);
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .map-controls button:hover { background: #f0f0f0; }
        .map-controls button:last-child { border-bottom: none; }

        /* 하단 버튼들 */
        .map-bottom-btns {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 15; pointer-events: none;
        }
        .map-btn {
            background: white; border: none; padding: 10px 15px;
            border-radius: 8px; font-size: 0.8rem; color: var(--text-dark);
            font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            pointer-events: auto;
        }
        .map-btn.active { background-color: #2C5C56; color: white; }

        /* 우측 액션 버튼 */
        .side-actions {
            position: absolute; right: 15px; bottom: 100px;
            display: flex; flex-direction: column; gap: 15px; z-index: 15;
        }
        .action-btn {
            display: flex; flex-direction: column; align-items: center;
            background: transparent; border: none; cursor: pointer; color: var(--text-dark);
        }
        .action-icon { font-size: 1.5rem; margin-bottom: 3px; text-shadow: 0 2px 4px rgba(255,255,255,0.8); }
        .action-text { font-size: 0.65rem; font-weight: 500; text-shadow: 0 2px 4px rgba(255,255,255,0.8); }
        
        /* 하단 네비게이션 */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background-color: #111; display: flex; justify-content: space-around; align-items: center;
            z-index: 30;
        }
        .nav-item { color: #888; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: white; }
        .nav-icon { font-size: 1.2rem; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <div style="display:flex; align-items:center;">
                <span style="font-size:1.5rem; margin-right:10px; cursor:pointer;">☰</span>
                <span class="header-title">Diari de viatge</span>
                <span class="header-subtitle">/ 10월의 여행 지도</span>
            </div>
            <div class="search-icon">🔍</div>
        </div>

        <div class="main-content">
            
            <div class="day-info">
                <div class="date-badge">
                    <span class="date-month">OCTUBRE</span>
                    <span class="date-day">15</span>
                    <span class="date-year">2024</span>
                </div>
                <div class="title-area">
                    <span class="day-text" id="day-text">DAY 01 10월 15일 화요일</span>
                    <h2 id="main-title">태화강 국가정원</h2>
                    <p id="main-desc">도심 속 자연을 만끽하며 울산의 첫인상을 만나요.</p>
                </div>
            </div>

            <!-- 지도 영역 -->
            <div class="map-section" id="map-section">
                
                <!-- 드래그되는 지도 월드 -->
                <div class="map-world" id="map-world">
                    <div class="map-bg-3d">
                        <div class="building b1"></div>
                        <div class="building b2"></div>
                        <div class="building b3"></div>
                        <div class="building b4"></div>
                        <div class="building b5"></div>
                    </div>

                    <!-- 핀들 -->
                    <div class="map-pin pin-taehwa" onclick="changeLocation(event, 'taehwa')">
                        <span class="pin-number">1</span> 태화강 국가정원
                    </div>
                    <div class="map-pin pin-daewangam" onclick="changeLocation(event, 'daewangam')">
                        <span class="pin-number">2</span> 대왕암공원
                    </div>
                    <div class="map-pin pin-jangsaengpo" onclick="changeLocation(event, 'jangsaengpo')">
                        <span class="pin-number">3</span> 장생포 고래마을
                    </div>
                </div>

                <!-- 고정 UI 요소들 -->
                <div class="location-card" id="info-card">
                    <div class="pin-icon">📍</div>
                    <h3 id="card-title">태화강 국가정원</h3>
                    <p id="card-coords">35.5489° N · 129.2967° E</p>
                </div>

                <div class="map-controls">
                    <button id="zoom-in" title="확대">+</button>
                    <button id="zoom-out" title="축소">-</button>
                    <button id="reset-map" title="초기화">🔄</button>
                </div>

                <div class="side-actions">
                    <button class="action-btn"><span class="action-icon">🤍</span><span class="action-text">좋아요</span></button>
                    <button class="action-btn"><span class="action-icon">💬</span><span class="action-text">0</span></button>
                    <button class="action-btn"><span class="action-icon">🔖</span><span class="action-text">저장</span></button>
                </div>

                <div class="map-bottom-btns">
                    <button class="map-btn">🎯 오늘 동선</button>
                    <button class="map-btn active">🗺️ 3D 지도</button>
                </div>

            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><span class="nav-icon">🏠</span><span>홈</span></div>
            <div class="nav-item"><span class="nav-icon">▶️</span><span>Shorts</span></div>
            <div class="nav-item"><span class="nav-icon" style="font-size:1.5rem;">➕</span></div>
            <div class="nav-item"><span class="nav-icon">📺</span><span>구독</span></div>
            <div class="nav-item"><span class="nav-icon">👤</span><span>내 페이지</span></div>
        </div>

    </div>

    <script>
        // --- 관광지 데이터 ---
        const ulSanSpots = {
            taehwa: {
                title: '태화강 국가정원',
                coords: '35.5489° N · 129.2967° E',
                desc: '도심 속 십리대숲과 계절별 아름다운 꽃들이 어우러진 울산의 대표 휴식처입니다.',
                dayText: 'DAY 01 10월 15일 화요일'
            },
            daewangam: {
                title: '대왕암공원',
                coords: '35.4912° N · 129.4403° E',
                desc: '울창한 송림과 기암괴석, 푸른 동해 바다가 만나는 낭만적인 해안 산책로입니다.',
                dayText: 'DAY 02 10월 16일 수요일'
            },
            jangsaengpo: {
                title: '장생포 고래문화마을',
                coords: '35.5035° N · 129.3809° E',
                desc: '1960년대 포경 전성시대의 모습을 고스란히 재현한 이색 테마 마을입니다.',
                dayText: 'DAY 03 10월 17일 목요일'
            }
        };

        // --- UI 업데이트 함수 ---
        function changeLocation(event, spotKey) {
            // 드래그 동작 중일 때는 클릭 이벤트 무시
            if (isDragging) return; 
            
            // 이벤트 버블링 방지 (지도 드래그로 번지지 않게)
            if(event) event.stopPropagation();

            const spot = ulSanSpots[spotKey];
            
            const mainTitle = document.getElementById('main-title');
            const mainDesc = document.getElementById('main-desc');
            const cardTitle = document.getElementById('card-title');
            const cardCoords = document.getElementById('card-coords');
            const dayText = document.getElementById('day-text');

            mainTitle.style.opacity = 0;
            mainDesc.style.opacity = 0;
            cardTitle.style.opacity = 0;

            setTimeout(() => {
                mainTitle.textContent = spot.title;
                mainDesc.textContent = spot.desc;
                cardTitle.textContent = spot.title;
                cardCoords.textContent = spot.coords;
                dayText.textContent = spot.dayText;

                mainTitle.style.opacity = 1;
                mainDesc.style.opacity = 1;
                cardTitle.style.opacity = 1;
            }, 200);
        }

        // --- 🌟 지도 드래그 및 줌 컨트롤 로직 ---
        const mapSection = document.getElementById('map-section');
        const mapWorld = document.getElementById('map-world');
        
        let isDragging = false;
        let startX, startY;
        let currentX = 0, currentY = 0;
        let scale = 1;

        // 마우스 다운 (드래그 시작)
        mapSection.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
            mapWorld.style.transition = 'none'; // 드래그 중에는 딜레이 없앰
        });

        // 마우스 무브 (드래그 중)
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateMapTransform();
        });

        // 마우스 업 (드래그 종료)
        window.addEventListener('mouseup', () => {
            isDragging = false;
            mapWorld.style.transition = 'transform 0.3s ease-out'; // 복귀 시 부드럽게
        });

        // 터치 지원 (모바일)
        mapSection.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - currentX;
            startY = e.touches[0].clientY - currentY;
            mapWorld.style.transition = 'none';
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX - startX;
            currentY = e.touches[0].clientY - startY;
            updateMapTransform();
            // 스크롤 방지
            if(e.cancelable) e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchend', () => {
            isDragging = false;
            mapWorld.style.transition = 'transform 0.3s ease-out';
        });

        // 줌 인/아웃 버튼
        document.getElementById('zoom-in').addEventListener('click', () => {
            scale += 0.2;
            if (scale > 2.5) scale = 2.5; // 최대 확대 제한
            updateMapTransform();
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            scale -= 0.2;
            if (scale < 0.6) scale = 0.6; // 최소 축소 제한
            updateMapTransform();
        });

        // 지도 초기화 버튼
        document.getElementById('reset-map').addEventListener('click', () => {
            currentX = 0;
            currentY = 0;
            scale = 1;
            mapWorld.style.transition = 'transform 0.5s ease-out';
            updateMapTransform();
        });

        // CSS Transform 적용 함수
        function updateMapTransform() {
            // X, Y 이동과 스케일을 동시에 적용
            mapWorld.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
        }

        // 텍스트 트랜지션용 CSS 추가
        const style = document.createElement('style');
        style.innerHTML = `
            #main-title, #main-desc, #card-title, #card-coords { transition: opacity 0.2s ease-in-out; }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
